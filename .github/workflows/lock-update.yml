name: Update runtime dependency lock
on:
  push:
    branches: [saas-development]
    paths: [package.json]
jobs:
  refresh-lockfile:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saas-development
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock PostgreSQL client dependencies"
            git pull --rebase origin saas-development
            git push origin HEAD:saas-development
          fi
